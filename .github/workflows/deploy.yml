name: Deploy to Cloudflare Pages

on:
  push:
    branches: [main]
  pull_request: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Check the complete source corpus
        run: |
          python3 .github/scripts/compliance.py .
          python3 .github/scripts/content_quality.py .
      - name: Stage only public content (preserve all source manuscripts)
        run: |
          python3 .github/scripts/stage_public_site.py --apply --output .public-site
          python3 .github/scripts/test_publication.py
      - name: Deploy to Cloudflare Pages
        # Only ever runs on an actual push to main. On a pull_request event
        # this step (and the one below) are skipped, not failed, so the
        # "deploy" check can report a real, honest result on PRs without
        # ever touching production -- required_status_checks can require
        # "deploy" on PRs without permanently locking out merges, since a
        # required check that only ever runs on push:main can never report
        # on a pull_request event at all.
        if: github.event_name == 'push'
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy .public-site --project-name=qutaifan-website --commit-dirty=true

      - name: Notify IndexNow (Bing / Yandex)
        if: github.event_name == 'push' && success()
        run: |
          KEY=f04b2b2b0e4ad248b406267e36386c55
          HOST=www.qutaifan.com
          # Build a JSON urlList from every <loc> in the deployed sitemap.
          URLS=$(grep -oP '(?<=<loc>)[^<]+' sitemap.xml | sed 's/.*/"&"/' | paste -sd, -)
          BODY=$(printf '{"host":"%s","key":"%s","keyLocation":"https://%s/%s.txt","urlList":[%s]}' "$HOST" "$KEY" "$HOST" "$KEY" "$URLS")
          echo "IndexNow payload: $BODY"
          # Non-fatal: a failed ping must never fail the deploy.
          curl -sS -X POST "https://api.indexnow.org/indexnow" \
            -H "Content-Type: application/json; charset=utf-8" \
            -d "$BODY" -w "\nIndexNow HTTP %{http_code}\n" || true
