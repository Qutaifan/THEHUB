name: Compliance

on:
  pull_request:
  workflow_dispatch:

jobs:
  compliance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run compliance checks
        run: python3 .github/scripts/compliance.py .
      - name: Test ad inventory rejection cases
        run: python3 .github/scripts/test_ad_inventory.py
